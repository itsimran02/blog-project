        tailwind.config = {

                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }

            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }

        }
        
        /* Slider Transitions */

            opacity: 0;

        }

            transform: scale(1);

        /* Markdown formatting for AI Output */

        .ai-content p { margin-bottom: 0.75rem; }
        .ai-content ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        .ai-content li { margin-bottom: 0.25rem; }

        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const icons = window.lucideReact || {};
        
        const { 
          Menu, X, GraduationCap, Globe, BookOpen, Users, 
          ChevronRight, ChevronLeft, ArrowRight, Mail, User, Briefcase, 
          Award, CheckCircle2, Linkedin, Twitter, Facebook, Instagram, Youtube,
          FlaskConical, ArrowUpRight, Star, Clock, FileText, LayoutTemplate,
          Phone, Info, Search, Filter, MapPin, ExternalLink, MessageSquare, 
          Send, Heart, Target, Compass, Sparkles, Wand2, Loader2, Bot,
          CreditCard, CalendarDays, Play
        } = icons;

        // --- GEMINI API INTEGRATION ---
        const apiKey = ""; // Runtime API Key
        
        const callGeminiAPI = async (prompt, systemInstruction = "") => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };
            if (systemInstruction) {
                payload.systemInstruction = { parts: [{ text: systemInstruction }] };
            }

            const delays = [1000, 2000, 4000, 8000, 16000]; // Exponential backoff
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response generated.";
                } catch (error) {
                    if (i === 4) throw error;
                    await new Promise(res => setTimeout(res, delays[i])); // Wait before retrying
                }
            }
        };

        const formatMarkdown = (text) => {
            if (!text) return null;
            let formatted = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h3>$1</h3>')
                .replace(/^- (.*$)/gim, '<ul><li>$1</li></ul>')
                .replace(/<\/ul>\n<ul>/g, '') // Merge adjacent lists
                .replace(/\n/g, '<br/>');
            
            return <div className="ai-content" dangerouslySetInnerHTML={{ __html: formatted }} />;
        };

        const renderIcon = (IconComponent, props = {}) => {
            const { key, ...restProps } = props;
            if (!IconComponent) return <span key={key} className="w-5 h-5 block bg-slate-200 rounded"></span>;
            return <IconComponent key={key} {...restProps} />;
        };

        // --- HERO SLIDER COMPONENT ---
        const HeroSlider = ({ navigateTo }) => {
            const [currentSlide, setCurrentSlide] = useState(0);
            
            const slides = [
                {
                    id: 1,
                    badge: "Welcome to Versatile Scientist",
                    badgeColor: "bg-primary-600",
                    title: "Empowering Students & Young Researchers",
                    description: "Discover scholarships, remote internships, and expert career guidance tailored for your academic success.",
                    image: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=1600&q=80",
                    primaryCTA: "Explore Opportunities",
                    secondaryCTA: "Start Here",
                    primaryAction: () => navigateTo('opportunities'),
                    secondaryAction: () => navigateTo('about')
                },
                {
                    id: 2,
                    badge: "📚 Exam & Application Guidance",
                    badgeColor: "bg-purple-600",
                    title: "How to Ace the Global STEM Scholarship 2026",
                    description: "Read our comprehensive new blog post detailing step-by-step strategies, proposal templates, and interview tips.",
                    image: "https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=1600&q=80",
                    primaryCTA: "Read the Guide",
                    secondaryCTA: "View Scholarships",
                    primaryAction: () => navigateTo('resources'),
                    secondaryAction: () => navigateTo('opportunities')
                },
                {
                    id: 3,
                    badge: "🔥 New Study Released",
                    badgeColor: "bg-emerald-600",
                    title: "The Future of AI in Healthcare Research",
                    description: "Our latest published study explores emerging career paths and essential skills needed for the next decade of medical innovation.",
                    image: "https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&w=1600&q=80",
                    primaryCTA: "Download Study",
                    secondaryCTA: "Browse Resources",
                    primaryAction: () => navigateTo('resources'),
                    secondaryAction: () => navigateTo('resources')
                },
                {
                    id: 4,
                    badge: "🚀 Trending Opportunity",
                    badgeColor: "bg-orange-600",
                    title: "Summer Research Internships at Top Labs",
                    description: "Applications are now open for remote and on-site internships at leading global research institutions. Don't miss out!",
                    image: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1600&q=80",
                    primaryCTA: "Apply Now",
                    secondaryCTA: "Learn More",
                    primaryAction: () => navigateTo('opportunities'),
                    secondaryAction: () => navigateTo('opportunities')
                }
            ];

            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentSlide((prev) => (prev === slides.length - 1 ? 0 : prev + 1));
                }, 6000); 
                return () => clearInterval(timer);
            }, [slides.length]);

            const goToSlide = (index) => setCurrentSlide(index);
            const prevSlide = () => setCurrentSlide((prev) => (prev === 0 ? slides.length - 1 : prev - 1));
            const nextSlide = () => setCurrentSlide((prev) => (prev === slides.length - 1 ? 0 : prev + 1));

            return (
                <section className="relative w-full h-[600px] lg:h-[700px] bg-slate-900 overflow-hidden">
                    {slides.map((slide, index) => (
                        <div 
                            key={slide.id} 
                            className={`absolute inset-0 w-full h-full transition-opacity duration-1000 ease-in-out ${index === currentSlide ? 'opacity-100 z-10' : 'opacity-0 z-0'}`}
                        >
                            <img src={slide.image} alt={slide.title} className="absolute inset-0 w-full h-full object-cover" />
                            <div className="absolute inset-0 bg-gradient-to-r from-slate-900/90 via-slate-900/70 to-slate-900/20"></div>
                            
                            <div className="absolute inset-0 flex items-center">
                                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
                                    <div className="max-w-3xl animate-fade-in" key={`content-${currentSlide}`}>
                                        <span className={`inline-block px-4 py-1 rounded-full text-white text-sm font-bold tracking-wide mb-6 ${slide.badgeColor}`}>
                                            {slide.badge}
                                        </span>
                                        <h1 className="text-4xl md:text-6xl font-extrabold text-white tracking-tight mb-6 leading-tight">
                                            {slide.title}
                                        </h1>
                                        <p className="text-lg md:text-xl text-slate-300 font-medium mb-10 max-w-2xl leading-relaxed">
                                            {slide.description}
                                        </p>
                                        <div className="flex flex-col sm:flex-row items-center gap-4">
                                            <button onClick={slide.primaryAction} className="w-full sm:w-auto px-8 py-3.5 bg-primary-600 text-white rounded-lg font-bold shadow-lg shadow-primary-600/30 hover:bg-primary-500 transition-all flex items-center justify-center gap-2">
                                                {slide.primaryCTA} {renderIcon(ArrowRight, {size: 18})}
                                            </button>
                                            <button onClick={slide.secondaryAction} className="w-full sm:w-auto px-8 py-3.5 bg-white/10 text-white border border-white/20 backdrop-blur-sm rounded-lg font-bold hover:bg-white/20 transition-all">
                                                {slide.secondaryCTA}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ))}

                    <button onClick={prevSlide} className="absolute left-4 top-1/2 -translate-y-1/2 z-20 w-12 h-12 bg-black/30 hover:bg-black/50 text-white rounded-full flex items-center justify-center backdrop-blur-sm transition-colors opacity-0 hover:opacity-100 lg:opacity-100 group">
                        {renderIcon(ChevronLeft, {size: 24, className: "group-hover:-translate-x-0.5 transition-transform"})}
                    </button>
                    <button onClick={nextSlide} className="absolute right-4 top-1/2 -translate-y-1/2 z-20 w-12 h-12 bg-black/30 hover:bg-black/50 text-white rounded-full flex items-center justify-center backdrop-blur-sm transition-colors opacity-0 hover:opacity-100 lg:opacity-100 group">
                        {renderIcon(ChevronRight, {size: 24, className: "group-hover:translate-x-0.5 transition-transform"})}
                    </button>

                    <div className="absolute bottom-8 left-1/2 -translate-x-1/2 z-20 flex gap-3">
                        {slides.map((_, index) => (
                            <button 
                                key={index} 
                                onClick={() => goToSlide(index)}
                                className={`transition-all duration-300 rounded-full ${index === currentSlide ? 'w-8 h-2.5 bg-primary-500' : 'w-2.5 h-2.5 bg-white/50 hover:bg-white/80'}`}
                                aria-label={`Go to slide ${index + 1}`}
                            />
                        ))}
                    </div>
                </section>
            );
        };

        // --- TESTIMONIAL SLIDER ---
        const TestimonialSlider = () => {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [itemsToShow, setItemsToShow] = useState(3);
            
            const testimonials = [
                {
                    id: 1,
                    quote: "The mentorship I received helped me refine my research proposal. Within two months, I secured a fully-funded PhD position in Europe. This platform truly changes lives.",
                    name: "Sarah Jenkins",
                    role: "PhD Candidate, Tech University",
                    img: "https://i.pravatar.cc/150?img=32"
                },
                {
                    id: 2,
                    quote: "I was struggling to find internships that fit my background. Versatile Scientist's opportunity board highlighted remote positions I never knew existed.",
                    name: "David Chen",
                    role: "Undergraduate Researcher",
                    img: "https://i.pravatar.cc/150?img=11"
                },
                {
                    id: 3,
                    quote: "Coming from a farming family, studying abroad felt impossible. The guidance and zero-cost support here gave me the confidence to apply and win a major scholarship.",
                    name: "Anil Kumar",
                    role: "First-Gen Scholar",
                    img: "https://i.pravatar.cc/150?img=8"
                },
                {
                    id: 4,
                    quote: "The expert reviews on my SOP were game-changing. They pointed out exactly what admissions committees are looking for, making my application stand out.",
                    name: "Maria Garcia",
                    role: "Master's Student, MIT",
                    img: "https://i.pravatar.cc/150?img=5"
                },
                {
                    id: 5,
                    quote: "Finding reliable research grants was a nightmare until I started using the AI Matchmaker. It perfectly aligned my profile with three active grants.",
                    name: "James Wilson",
                    role: "Post-Doc Researcher",
                    img: "https://i.pravatar.cc/150?img=12"
                },
                {
                    id: 6,
                    quote: "The 1-on-1 mentorship session gave me the exact clarity I needed for my career transition from academia to industry data science.",
                    name: "Priya Patel",
                    role: "Data Scientist",
                    img: "https://i.pravatar.cc/150?img=20"
                }
            ];

            useEffect(() => {
                const handleResize = () => {
                    if (window.innerWidth < 768) {
                        setItemsToShow(1);
                    } else if (window.innerWidth < 1024) {
                        setItemsToShow(2);
                    } else {
                        setItemsToShow(3);
                    }
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const maxIndex = Math.max(0, testimonials.length - itemsToShow);

            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentIndex((prev) => (prev >= maxIndex ? 0 : prev + 1));
                }, 4000); 
                return () => clearInterval(timer);
            }, [maxIndex]);

            const nextSlide = () => setCurrentIndex((prev) => (prev >= maxIndex ? 0 : prev + 1));
            const prevSlide = () => setCurrentIndex((prev) => (prev === 0 ? maxIndex : prev - 1));
            const goToSlide = (index) => setCurrentIndex(index);

            return (
                <div className="relative max-w-7xl mx-auto px-4 sm:px-12">
                    <div className="overflow-hidden relative rounded-2xl">
                        <div 
                            className="flex transition-transform duration-500 ease-in-out" 
                            style={{ transform: `translateX(-${currentIndex * (100 / itemsToShow)}%)` }}
                        >
                            {testimonials.map((t) => (
                                <div key={t.id} className="flex-shrink-0 px-2 sm:px-4" style={{ width: `${100 / itemsToShow}%` }}>
                                    <div className="bg-slate-50 p-8 rounded-2xl border border-slate-200 shadow-sm h-full flex flex-col justify-between items-center text-center">
                                        <div className="flex flex-col items-center">
                                            <div className="flex text-yellow-400 mb-4">
                                                {[1,2,3,4,5].map(i => renderIcon(Star, {key: i, size: 20, fill: "currentColor"}))}
                                            </div>
                                            <p className="text-slate-700 italic mb-8 leading-relaxed text-sm lg:text-base">"{t.quote}"</p>
                                        </div>
                                        <div className="flex flex-col items-center gap-3 mt-auto">
                                            <div className="w-14 h-14 bg-slate-200 rounded-full overflow-hidden shrink-0 border-2 border-white shadow-md">
                                                <img src={t.img} alt={t.name} className="w-full h-full object-cover" />
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-slate-900">{t.name}</h4>
                                                <p className="text-xs text-slate-500 font-medium">{t.role}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                    
                    <button onClick={prevSlide} className="absolute left-0 sm:left-2 top-1/2 -translate-y-1/2 w-12 h-12 bg-white border border-slate-200 text-slate-600 rounded-full flex items-center justify-center shadow-md hover:bg-primary-50 hover:text-primary-600 hover:border-primary-200 transition-all z-10 focus:outline-none group">
                        {renderIcon(ChevronLeft, {size: 24, className: "group-hover:-translate-x-0.5 transition-transform"})}
                    </button>
                    <button onClick={nextSlide} className="absolute right-0 sm:right-2 top-1/2 -translate-y-1/2 w-12 h-12 bg-white border border-slate-200 text-slate-600 rounded-full flex items-center justify-center shadow-md hover:bg-primary-50 hover:text-primary-600 hover:border-primary-200 transition-all z-10 focus:outline-none group">
                        {renderIcon(ChevronRight, {size: 24, className: "group-hover:translate-x-0.5 transition-transform"})}
                    </button>

                    <div className="flex justify-center gap-2 mt-8">
                        {Array.from({ length: maxIndex + 1 }).map((_, idx) => (
                            <button 
                                key={idx} 
                                onClick={() => goToSlide(idx)}
                                className={`h-2.5 rounded-full transition-all duration-300 ${idx === currentIndex ? 'bg-primary-600 w-8' : 'bg-slate-300 w-2.5 hover:bg-slate-400'}`}
                                aria-label={`Go to slide ${idx + 1}`}
                            />
                        ))}
                    </div>
                </div>
            );
        };

        // --- MEDIA GALLERY COMPONENT (VISUAL TRUST BUILDER) ---
        const MediaGallery = () => {
            const [filter, setFilter] = useState('All');
            const [selectedMedia, setSelectedMedia] = useState(null);
            
            const categories = ['All', 'Workshops', 'Sessions', 'Testimonials'];
            
            const mediaItems = [
                { id: 1, category: 'Workshops', type: 'image', src: 'https://images.unsplash.com/photo-1544928147-79a2dbc1f389?auto=format&fit=crop&w=1200&q=80', title: 'Data Science Bootcamp in Mumbai' },
                { id: 2, category: 'Sessions', type: 'video', src: 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&w=1200&q=80', videoUrl: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', title: '1-on-1 Mentorship with Dr. Chen' },
                { id: 3, category: 'Testimonials', type: 'video', src: 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80', videoUrl: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', title: 'Anil Kumar shares his fellowship journey' },
                { id: 4, category: 'Workshops', type: 'image', src: 'https://images.unsplash.com/photo-1515187029135-18ee286d815b?auto=format&fit=crop&w=1200&q=80', title: 'Research Proposal Writing Seminar' },
                { id: 5, category: 'Sessions', type: 'image', src: 'https://images.unsplash.com/photo-1573164713988-8665fc963095?auto=format&fit=crop&w=1200&q=80', title: 'Group Lab Tour & Faculty Q&A' },
                { id: 6, category: 'Testimonials', type: 'video', src: 'https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=1200&q=80', videoUrl: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4', title: 'Alumni networking event in London' }
            ];

            const filteredItems = filter === 'All' ? mediaItems : mediaItems.filter(item => item.category === filter);

            return (
                <section className="py-20 bg-white border-t border-slate-200">
                    <div className="max-w-7xl mx-auto px-4">
                        <div className="text-center mb-10">
                            <span className="text-primary-600 font-bold tracking-wider uppercase text-sm">Visual Trust Builder</span>
                            <h2 className="text-3xl font-bold text-slate-900 mt-2">Impact in Action</h2>
                            <div className="w-20 h-1.5 bg-primary-500 mx-auto mt-4 rounded-full mb-6"></div>
                            <p className="text-slate-600 max-w-2xl mx-auto text-lg leading-relaxed">
                                See how we're transforming lives through hands-on workshops, expert sessions, and real success stories from our community.
                            </p>
                        </div>

                        <div className="flex flex-wrap justify-center gap-3 mb-12">
                            {categories.map(cat => (
                                <button
                                    key={cat}
                                    onClick={() => setFilter(cat)}
                                    className={`px-6 py-2.5 rounded-full font-bold text-sm transition-all border ${filter === cat ? 'bg-primary-600 text-white border-primary-600 shadow-md shadow-primary-600/30' : 'bg-white text-slate-600 border-slate-200 hover:border-primary-300 hover:bg-primary-50 hover:text-primary-600'}`}
                                >
                                    {cat}
                                </button>
                            ))}
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                            {filteredItems.map(item => (
                                <div 
                                    key={item.id} 
                                    onClick={() => setSelectedMedia(item)}
                                    className="group relative aspect-[4/3] rounded-2xl overflow-hidden cursor-pointer bg-slate-100 shadow-sm hover:shadow-xl transition-all"
                                >
                                    <img src={item.src} alt={item.title} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/10 to-transparent opacity-80 group-hover:opacity-100 transition-opacity"></div>
                                    
                                    {item.type === 'video' && (
                                        <div className="absolute inset-0 flex items-center justify-center">
                                            <div className="w-14 h-14 bg-white/30 backdrop-blur-md rounded-full flex items-center justify-center text-white border border-white/50 group-hover:bg-primary-600 group-hover:border-primary-600 transition-all transform group-hover:scale-110">
                                                {renderIcon(Play, {size: 24, fill: "currentColor", className: "ml-1"})}
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div className="absolute bottom-0 left-0 right-0 p-6 translate-y-2 group-hover:translate-y-0 transition-transform">
                                        <span className="inline-block px-2.5 py-1 bg-primary-500/90 backdrop-blur-sm text-white text-[10px] font-bold uppercase tracking-wider rounded mb-2">
                                            {item.category}
                                        </span>
                                        <h3 className="text-white font-bold text-lg leading-tight">{item.title}</h3>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {selectedMedia && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/95 backdrop-blur-sm p-4 animate-fade-in" onClick={() => setSelectedMedia(null)}>
                                <button 
                                    onClick={() => setSelectedMedia(null)} 
                                    className="absolute top-6 right-6 w-12 h-12 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center transition-colors backdrop-blur-md focus:outline-none z-50"
                                >
                                    {renderIcon(X, {size: 24})}
                                </button>
                                
                                <div className="max-w-5xl w-full max-h-[85vh] relative flex flex-col items-center" onClick={e => e.stopPropagation()}>
                                    {selectedMedia.type === 'video' ? (
                                        <video 
                                            src={selectedMedia.videoUrl} 
                                            controls 
                                            autoPlay 
                                            className="w-full max-h-[80vh] rounded-2xl shadow-2xl ring-1 ring-white/20 bg-black outline-none"
                                        >
                                            Your browser does not support the video tag.
                                        </video>
                                    ) : (
                                        <img src={selectedMedia.src} alt={selectedMedia.title} className="w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl ring-1 ring-white/20" />
                                    )}
                                    
                                    <div className="absolute -bottom-12 sm:-bottom-16 left-0 right-0 text-center px-4">
                                        <h3 className="text-white font-bold text-xl sm:text-2xl drop-shadow-md">{selectedMedia.title}</h3>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </section>
            );

                        <button onClick={() => navigateTo('home')} className="flex items-center gap-2 text-slate-500 hover:text-primary-600 font-medium mb-8 transition-colors group">
                            {renderIcon(ChevronLeft, {size: 20, className: "group-hover:-translate-x-1 transition-transform"})} Back
                        </button>

                        <div className="flex flex-col lg:flex-row gap-10">
                            {/* Left Side: Booking Form */}
                            <div className="flex-1">
                                {step < 3 && (
                                    <div className="mb-8">
                                        <h1 className="text-3xl font-extrabold text-slate-900 mb-2">Complete Your Booking</h1>
                                        <p className="text-slate-600">Step {step} of 2: {step === 1 ? 'Select Date & Time' : 'Details & Payment'}</p>
                                    </div>
                                )}

                                <div className="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
                                    {step === 1 && (
                                        <div className="p-8 md:p-10 animate-fade-in">
                                            <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
                                                <div className="p-2 bg-primary-50 text-primary-600 rounded-lg">{renderIcon(CalendarDays, {size: 20})}</div>
                                                <h3 className="text-xl font-bold text-slate-800">Select Availability</h3>
                                            </div>
                                            
                                            <div className="space-y-8">
                                                <div className="space-y-3">
                                                    <label className="text-sm font-bold text-slate-700 block">Choose a Date</label>
                                                    <input 
                                                        type="date" 
                                                        name="date"
                                                        min={today}
                                                        value={formData.date} 
                                                        onChange={handleChange} 
                                                        className="w-full max-w-sm px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 outline-none transition-all cursor-pointer" 
                                                    />
                                                </div>

                                                <div className={`space-y-3 transition-opacity duration-300 ${formData.date ? 'opacity-100' : 'opacity-50 pointer-events-none'}`}>
                                                    <label className="text-sm font-bold text-slate-700 block">Available Time Slots</label>
                                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                                        {timeSlots.map(time => (
                                                            <button 
                                                                key={time}
                                                                onClick={() => setFormData({...formData, time})}
                                                                className={`py-3 px-4 rounded-xl border font-bold text-sm transition-all ${formData.time === time ? 'bg-primary-600 border-primary-600 text-white shadow-md shadow-primary-600/30' : 'bg-white border-slate-200 text-slate-700 hover:border-primary-300 hover:bg-primary-50'}`}
                                                            >
                                                                {time}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="pt-10 mt-8 border-t border-slate-100 flex justify-end">
                                                <button 
                                                    onClick={() => setStep(2)} 
                                                    disabled={!formData.date || !formData.time}
                                                    className="px-8 py-4 bg-primary-600 text-white rounded-xl font-bold hover:bg-primary-700 transition-colors shadow-lg shadow-primary-600/30 flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                                                >
                                                    Continue to Payment {renderIcon(ArrowRight, {size: 18})}
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {step === 2 && (
                                        <form onSubmit={handlePayment} className="p-8 md:p-10 animate-fade-in">
                                            <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
                                                <div className="p-2 bg-emerald-50 text-emerald-600 rounded-lg">{renderIcon(User, {size: 20})}</div>
                                                <h3 className="text-xl font-bold text-slate-800">Your Details</h3>
                                            </div>
                                            
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
                                                <div className="space-y-2">
                                                    <label className="text-sm font-semibold text-slate-700">Full Name</label>
                                                    <input required type="text" name="name" value={formData.name} onChange={handleChange} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 outline-none transition-all" placeholder="John Doe" />
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-sm font-semibold text-slate-700">Email Address</label>
                                                    <input required type="email" name="email" value={formData.email} onChange={handleChange} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 outline-none transition-all" placeholder="john@example.com" />
                                                </div>
                                                <div className="space-y-2 sm:col-span-2">
                                                    <label className="text-sm font-semibold text-slate-700">What would you like to discuss?</label>
                                                    <textarea required name="topic" value={formData.topic} onChange={handleChange} rows="2" className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-primary-500 outline-none transition-all resize-none" placeholder="e.g. PhD application strategy, SOP review..."></textarea>
                                                </div>
                                            </div>

                                            <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
                                                <div className="p-2 bg-indigo-50 text-indigo-600 rounded-lg">{renderIcon(CreditCard, {size: 20})}</div>
                                                <h3 className="text-xl font-bold text-slate-800">Payment Information</h3>
                                            </div>

                                            <div className="space-y-6">
                                                <div className="space-y-2">
                                                    <label className="text-sm font-semibold text-slate-700">Card Number</label>
                                                    <input required type="text" name="cardNumber" maxLength="19" value={formData.cardNumber} onChange={handleChange} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-mono tracking-widest" placeholder="0000 0000 0000 0000" />
                                                </div>
                                                <div className="grid grid-cols-2 gap-6">
                                                    <div className="space-y-2">
                                                        <label className="text-sm font-semibold text-slate-700">Expiry (MM/YY)</label>
                                                        <input required type="text" name="expiry" maxLength="5" value={formData.expiry} onChange={handleChange} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-mono text-center" placeholder="12/25" />
                                                    </div>
                                                    <div className="space-y-2">
                                                        <label className="text-sm font-semibold text-slate-700">CVV</label>
                                                        <input required type="password" name="cvv" maxLength="4" value={formData.cvv} onChange={handleChange} className="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none transition-all font-mono text-center tracking-widest" placeholder="•••" />
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="pt-10 mt-8 border-t border-slate-100 flex items-center justify-between">
                                                <button type="button" onClick={() => setStep(1)} className="text-slate-500 font-bold hover:text-slate-800 transition-colors">
                                                    Go Back
                                                </button>
                                                <button 
                                                    type="submit" 
                                                    disabled={isProcessing}
                                                    className="px-8 py-4 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-colors shadow-lg shadow-slate-900/20 flex items-center gap-2 min-w-[200px] justify-center"
                                                >
                                                    {isProcessing ? <>{renderIcon(Loader2, {size: 18, className: "animate-spin"})} Processing...</> : `Pay $${price} & Confirm`}
                                                </button>
                                            </div>
                                        </form>
                                    )}

                                    {step === 3 && (
                                        <div className="p-12 text-center animate-fade-in">
                                            <div className="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm">
                                                {renderIcon(CheckCircle2, {size: 48})}
                                            </div>
                                            <h3 className="text-3xl font-extrabold text-slate-900 mb-4">Booking Confirmed!</h3>
                                            <p className="text-lg text-slate-600 mb-8 max-w-md mx-auto leading-relaxed">
                                                Thank you, {formData.name}! Your <strong>{plan}</strong> session is successfully booked for <strong>{formData.date} at {formData.time}</strong>.
                                            </p>
                                            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100 inline-block mb-10 text-left">
                                                <p className="text-sm text-slate-500 mb-1">Booking Reference</p>
                                                <p className="text-xl font-mono font-bold text-slate-800 tracking-wider">VS-{Math.floor(Math.random() * 90000) + 10000}</p>
                                            </div>
                                            <div>
                                                <button onClick={() => navigateTo('home')} className="px-8 py-3.5 bg-primary-600 text-white rounded-xl font-bold hover:bg-primary-700 transition-colors shadow-lg shadow-primary-600/30">
                                                    Back to Dashboard
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Right Side: Order Summary */}
                            <div className="w-full lg:w-80 flex-shrink-0">
                                <div className="bg-primary-900 text-white p-8 rounded-3xl shadow-xl sticky top-24">
                                    <h3 className="font-bold text-primary-200 uppercase tracking-wider text-sm mb-6 pb-4 border-b border-primary-800">Order Summary</h3>
                                    
                                    <div className="mb-6">
                                        <h4 className="text-xl font-bold mb-1">{plan}</h4>
                                        <p className="text-primary-300 text-sm">Premium Mentorship Session</p>
                                    </div>
                                    
                                    {formData.date && formData.time && (
                                        <div className="mb-6 p-4 bg-primary-800/50 rounded-xl space-y-2">
                                            <div className="flex items-center gap-2 text-sm">
                                                {renderIcon(CalendarDays, {size: 16, className: "text-primary-300"})}
                                                <span>{formData.date}</span>
                                            </div>
                                            <div className="flex items-center gap-2 text-sm">
                                                {renderIcon(Clock, {size: 16, className: "text-primary-300"})}
                                                <span>{formData.time}</span>
                                            </div>
                                        </div>
                                    )}
                                    
                                    <div className="pt-6 border-t border-primary-800 space-y-3">
                                        <div className="flex justify-between text-primary-200">
                                            <span>Subtotal</span>
                                            <span>${price}.00</span>
                                        </div>
                                        <div className="flex justify-between text-primary-200">
                                            <span>Taxes</span>
                                            <span>$0.00</span>
                                        </div>
                                        <div className="flex justify-between text-2xl font-bold pt-4 border-t border-primary-800 mt-4">
                                            <span>Total</span>
                                            <span>${price}.00</span>
                                        </div>
                                    </div>

                                    <div className="mt-8 flex items-start gap-3 p-4 bg-emerald-500/10 rounded-xl text-emerald-400 text-sm">
                                        <div className="shrink-0 mt-0.5">{renderIcon(CheckCircle2, {size: 16})}</div>
                                        <p>Secure, encrypted checkout. Satisfaction guaranteed.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP SHELL ---
        const App = () => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [currentView, setCurrentView] = useState('home'); 
            const [selectedAudience, setSelectedAudience] = useState(null);
            const [routeParams, setRouteParams] = useState({});

            const navigateTo = (view, data = null) => {
                setCurrentView(view);
                if (view === 'audience') {
                    setSelectedAudience(data);
                } else if (view === 'resources' && data?.tab) {
                    setRouteParams(data);
                } else if (view === 'booking') {
                    setRouteParams(data || {});
                } else {
                    setRouteParams({});
                }
                setIsMobileMenuOpen(false);
                window.scrollTo(0, 0); 
            };

            const renderView = () => {
                switch(currentView) {
                    case 'home':
                        return <HomeView navigateTo={navigateTo} />;
                    case 'audience':
                        return <AudienceView audience={selectedAudience} navigateTo={navigateTo} />;
                    case 'opportunities':
                        return <OpportunitiesView navigateTo={navigateTo} />;
                    case 'resources':
                        return <ResourcesView currentTab={routeParams.tab || 'articles'} navigateTo={navigateTo} />;
                    case 'about':
                        return <AboutView navigateTo={navigateTo} />;
                    case 'contact':
                        return <ContactView navigateTo={navigateTo} />;
                    case 'expert-application':
                        return <ExpertApplicationView navigateTo={navigateTo} />;
                    case 'booking':
                        return <BookingView routeParams={routeParams} navigateTo={navigateTo} />;
                    case 'privacy':
                        return <PrivacyPolicyView navigateTo={navigateTo} />;
                    default:
                        return <HomeView navigateTo={navigateTo} />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col bg-white">
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-20">
                                <div className="flex items-center gap-3 cursor-pointer group" onClick={() => navigateTo('home')}>
                                    <img 
                                        src="https://lh3.googleusercontent.com/d/1r-WOZL6G8q2O7P7mlZbej4uVZ_FPZija" 
                                        alt="Versatile Scientist Logo" 
                                        className="h-10 w-auto group-hover:scale-105 transition-transform rounded-full"
                                    />
                                    <div className="flex flex-col">
                                        <span className="font-extrabold text-xl tracking-tight text-slate-900 leading-none group-hover:text-primary-600 transition-colors">VERSATILE</span>
                                        <span className="font-semibold text-sm tracking-[0.2em] text-primary-600 leading-none mt-1">SCIENTIST</span>
                                    </div>
                                </div>

                                <nav className="hidden md:flex space-x-8">
                                    <button onClick={() => navigateTo('opportunities')} className={`font-medium transition-colors ${currentView === 'opportunities' ? 'text-primary-600 border-b-2 border-primary-600' : 'text-slate-600 hover:text-primary-600'}`}>Opportunities</button>
                                    <button onClick={() => navigateTo('resources')} className={`font-medium transition-colors ${currentView === 'resources' ? 'text-primary-600 border-b-2 border-primary-600' : 'text-slate-600 hover:text-primary-600'}`}>Resources & Blogs</button>
                                    <button onClick={() => navigateTo('about')} className={`font-medium transition-colors ${currentView === 'about' ? 'text-primary-600 border-b-2 border-primary-600' : 'text-slate-600 hover:text-primary-600'}`}>About</button>
                                    <button onClick={() => navigateTo('contact')} className={`font-medium transition-colors ${currentView === 'contact' ? 'text-primary-600 border-b-2 border-primary-600' : 'text-slate-600 hover:text-primary-600'}`}>Contact</button>
                                </nav>

                                <button className="md:hidden text-slate-600 p-2 rounded-lg hover:bg-slate-100" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                    {renderIcon(isMobileMenuOpen ? X : Menu, {size: 28})}
                                </button>
                            </div>
                        </div>

                        {isMobileMenuOpen && (
                            <div className="md:hidden bg-white border-t border-slate-100 px-4 py-4 space-y-2 shadow-inner absolute w-full">
                                <button onClick={() => navigateTo('opportunities')} className={`block w-full text-left font-medium py-3 px-4 rounded-lg ${currentView === 'opportunities' ? 'bg-primary-50 text-primary-600' : 'text-slate-600 hover:bg-slate-50'}`}>Opportunities</button>
                                <button onClick={() => navigateTo('resources')} className={`block w-full text-left font-medium py-3 px-4 rounded-lg ${currentView === 'resources' ? 'bg-primary-50 text-primary-600' : 'text-slate-600 hover:bg-slate-50'}`}>Resources & Blogs</button>
                                <button onClick={() => navigateTo('about')} className={`block w-full text-left font-medium py-3 px-4 rounded-lg ${currentView === 'about' ? 'bg-primary-50 text-primary-600' : 'text-slate-600 hover:bg-slate-50'}`}>About</button>
                                <button onClick={() => navigateTo('contact')} className={`block w-full text-left font-medium py-3 px-4 rounded-lg ${currentView === 'contact' ? 'bg-primary-50 text-primary-600' : 'text-slate-600 hover:bg-slate-50'}`}>Contact</button>
                            </div>
                        )}
                    </header>

                    <main className="flex-grow">
                        {renderView()}
                    </main>

                    <footer className="bg-slate-900 text-slate-300 py-12 border-t border-slate-800 mt-auto">
                        <div className="max-w-7xl mx-auto px-4">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8 border-b border-slate-800 pb-8">
                                <div className="col-span-1 md:col-span-2">
                                    <div className="flex items-center gap-3 mb-4 cursor-pointer" onClick={() => navigateTo('home')}>
                                        <img 
                                            src="https://lh3.googleusercontent.com/d/1r-WOZL6G8q2O7P7mlZbej4uVZ_FPZija" 
                                            alt="Versatile Scientist Logo" 
                                            className="h-8 w-auto rounded-full"
                                        />
                                        <span className="font-bold text-white tracking-wide">VERSATILE SCIENTIST</span>
                                    </div>
                                    <p className="text-sm text-slate-400 max-w-sm mb-6 leading-relaxed">
                                        Democratizing access to scientific research, internships, and educational funding for tomorrow's leaders.
                                    </p>
                                    <div className="flex gap-4">
                                        <button className="text-slate-400 hover:text-white transition-colors">{renderIcon(Linkedin, {size: 20})}</button>
                                        <button className="text-slate-400 hover:text-white transition-colors">{renderIcon(Twitter, {size: 20})}</button>
                                        <button className="text-slate-400 hover:text-white transition-colors">{renderIcon(Facebook, {size: 20})}</button>
                                    </div>
                                </div>
                                <div>
                                    <h4 className="font-bold text-white mb-4">Quick Links</h4>
                                    <ul className="space-y-2 text-sm">
                                        <li><button onClick={() => navigateTo('opportunities')} className="hover:text-white transition-colors">Find Scholarships</button></li>
                                        <li><button onClick={() => navigateTo('opportunities')} className="hover:text-white transition-colors">Latest Internships</button></li>
                                        <li><button onClick={() => navigateTo('resources')} className="hover:text-white transition-colors">Career Guidance</button></li>
                                        <li><button onClick={() => navigateTo('about')} className="hover:text-white transition-colors">About Us</button></li>
                                    </ul>
                                </div>
                                <div>
                                    <h4 className="font-bold text-white mb-4">Resources</h4>
                                    <ul className="space-y-2 text-sm">
                                        <li><button onClick={() => navigateTo('resources')} className="hover:text-white transition-colors">Application Guides</button></li>
                                        <li><button onClick={() => navigateTo('resources', { tab: 'tools' })} className="hover:text-white transition-colors">AI Application Tools ✨</button></li>
                                        <li><button onClick={() => navigateTo('privacy')} className="hover:text-white transition-colors">Privacy Policy</button></li>
                                        <li><button onClick={() => navigateTo('contact')} className="hover:text-white transition-colors">Contact Support</button></li>
                                    </ul>
                                </div>
                            </div>
                            <div className="text-center text-sm text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-4">
                                <p>&copy; {new Date().getFullYear()} Versatile Scientist. All rights reserved.</p>
                                <p>Content may not be reproduced without permission.</p>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
